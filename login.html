<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Feedback inbox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
  :root{--bg:#0A0A0B;--card:#141416;--fg:#f2f2f0;--dim:#9a9aa0;--line:rgba(255,255,255,.12)}
  @media (prefers-color-scheme:light){:root{--bg:#f4f4f3;--card:#fff;--fg:#111;--dim:#666;--line:rgba(0,0,0,.12)}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font:15px/1.5 "Public Sans",system-ui,sans-serif;padding:16px}
  form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
  h1{font:700 20px "Archivo",system-ui,sans-serif;margin:0 0 4px}
  p{color:var(--dim);margin:0 0 18px;font-size:13.5px}
  input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;outline:none}
  input:focus{border-color:var(--dim)}
  button{width:100%;margin-top:12px;padding:11px;border-radius:10px;border:0;background:var(--fg);color:var(--bg);font:700 14px "Public Sans",system-ui,sans-serif;cursor:pointer}
  .err{color:#ff5a52;font-size:13px;margin-top:10px;display:none}
  .err.on{display:block}
</style>
</head>
<body>
<form method="post" action="login">
  <h1>Feedback inbox</h1>
  <p>Private. Only Shovon can open this.</p>
  <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
  <button type="submit">Open</button>
  <div class="err" id="wrong">Wrong password.</div>
  <div class="err" id="wait">Too many tries. Wait 15 minutes.</div>
</form>
<script src="inbox.js"></script>
</body>
</html>
